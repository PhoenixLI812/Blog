<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title & Header -->
  <text x="40" y="45" fill="#f0f6fc" font-size="20" font-weight="bold">费城半导体指数 (SOX) 周线技术结构与宏观基本面背离图</text>
  <text x="40" y="70" fill="#8b949e" font-size="12">PHLX Semiconductor Sector Index (^SOX) Weekly Chart: Wyckoff Distribution &amp; Macro Disparity</text>

  <!-- Legend & Tags -->
  <rect x="720" y="25" width="240" height="50" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="735" cy="42" r="5" fill="#f85149"/>
  <text x="748" y="46" fill="#c9d1d9" font-size="11">MA 20 (短期均线)</text>
  <circle cx="840" cy="42" r="5" fill="#58a6ff"/>
  <text x="853" y="46" fill="#c9d1d9" font-size="11">MA 50 (中期趋势)</text>
  <circle cx="735" cy="62" r="5" fill="#d29922"/>
  <text x="748" y="65" fill="#c9d1d9" font-size="11">MA 200 (牛熊分水)</text>
  <text x="840" y="65" fill="#7ee787" font-size="11">量能 / 动量</text>

  <!-- Grid Lines -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="3,3">
    <!-- Horizontal Grids (Price) -->
    <line x1="80" y1="100" x2="940" y2="100"/>
    <line x1="80" y1="160" x2="940" y2="160"/>
    <line x1="80" y1="220" x2="940" y2="220"/>
    <line x1="80" y1="280" x2="940" y2="280"/>
    <line x1="80" y1="340" x2="940" y2="340"/>
    <line x1="80" y1="400" x2="940" y2="400"/>
    <!-- Divider between Price and MACD -->
    <line x1="80" y1="440" x2="940" y2="440" stroke="#30363d" stroke-dasharray="none" stroke-width="1.5"/>
    <line x1="80" y1="520" x2="940" y2="520"/>
    <!-- Divider between MACD and Volume/Breadth -->
    <line x1="80" y1="560" x2="940" y2="560" stroke="#30363d" stroke-dasharray="none" stroke-width="1.5"/>
  </g>

  <!-- Y-Axis Labels (Price) -->
  <g fill="#8b949e" font-size="11" text-anchor="end">
    <text x="70" y="104">6,000</text>
    <text x="70" y="164">5,200</text>
    <text x="70" y="224">4,400</text>
    <text x="70" y="284">3,600</text>
    <text x="70" y="344">2,800</text>
    <text x="70" y="404">2,000</text>
    <text x="70" y="485">MACD</text>
    <text x="70" y="605">量能 / 宽度</text>
  </g>

  <!-- X-Axis Labels (Time) -->
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="140" y="635">2022 Q4 (底部启动)</text>
    <text x="320" y="635">2023 Q3 (AI主升浪)</text>
    <text x="520" y="635">2024 Q2 (突破5,000)</text>
    <text x="700" y="635">2024-2025 (冲顶派发区)</text>
    <text x="860" y="635">周期下半场 (二阶导放缓)</text>
  </g>

  <!-- Moving Averages Lines (Simulated Path) -->
  <!-- MA 200 (Long term support) -->
  <path d="M 100,390 Q 300,360 500,310 T 800,240 T 920,210" fill="none" stroke="#d29922" stroke-width="2"/>
  <!-- MA 50 (Intermediate) -->
  <path d="M 100,380 Q 250,330 450,230 T 700,160 T 900,180" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <!-- MA 20 (Short term) -->
  <path d="M 100,370 Q 250,310 450,190 T 680,120 T 780,150 T 880,190" fill="none" stroke="#f85149" stroke-width="2"/>

  <!-- Candlesticks (Schematic Weekly Trend) -->
  <!-- Phase 1: 2022 Bottom (~2,089) -->
  <g stroke="#3fb950" stroke-width="1.5">
    <line x1="110" y1="375" x2="110" y2="405"/>
    <rect x="106" y="380" width="8" height="20" fill="#3fb950"/>
    <line x1="130" y1="360" x2="130" y2="395"/>
    <rect x="126" y="365" width="8" height="22" fill="#3fb950"/>
    <line x1="150" y1="345" x2="150" y2="375"/>
    <rect x="146" y="350" width="8" height="20" fill="#3fb950"/>
  </g>

  <!-- Phase 2: 2023 AI Surge (ChatGPT Wave) -->
  <g stroke="#3fb950" stroke-width="1.5">
    <line x1="200" y1="320" x2="200" y2="360"/>
    <rect x="196" y="325" width="8" height="25" fill="#3fb950"/>
    <line x1="230" y1="285" x2="230" y2="330"/>
    <rect x="226" y="290" width="8" height="30" fill="#3fb950"/>
    <line x1="260" y1="270" x2="260" y2="310"/>
    <rect x="256" y="275" width="8" height="25" fill="#3fb950"/>
    <line x1="300" y1="240" x2="300" y2="280"/>
    <rect x="296" y="245" width="8" height="25" fill="#3fb950"/>
    <!-- Pullback -->
    <line x1="330" y1="250" x2="330" y2="295" stroke="#f85149"/>
    <rect x="326" y="255" width="8" height="30" fill="#f85149"/>
    <line x1="360" y1="260" x2="360" y2="305" stroke="#f85149"/>
    <rect x="356" y="265" width="8" height="32" fill="#f85149"/>
  </g>

  <!-- Phase 3: 2024 Parabolic Run (Nvidia Earnings / ATH Peak) -->
  <g stroke="#3fb950" stroke-width="1.5">
    <line x1="410" y1="220" x2="410" y2="265"/>
    <rect x="406" y="225" width="8" height="30" fill="#3fb950"/>
    <line x1="450" y1="180" x2="450" y2="230"/>
    <rect x="446" y="185" width="8" height="35" fill="#3fb950"/>
    <line x1="490" y1="150" x2="490" y2="200"/>
    <rect x="486" y="155" width="8" height="35" fill="#3fb950"/>
    <line x1="530" y1="125" x2="530" y2="170"/>
    <rect x="526" y="130" width="8" height="30" fill="#3fb950"/>
