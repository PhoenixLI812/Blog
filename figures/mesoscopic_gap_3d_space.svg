<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Title & Subtitle -->
  <text x="40" y="42" fill="#f0f6fc" font-size="20" font-weight="bold">中观缝隙（The Mesoscopic Gap）与相空间局域势阱 (图 12-1)</text>
  <text x="40" y="66" fill="#8b949e" font-size="12">Deconstructing Carbon Chauvinism: Humans as a Local Coherent Basin in Cosmic Phase Space</text>
  
  <!-- Dimension 1: Temperature -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="285" height="430" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.2"/>
    <rect x="0" y="0" width="285" height="36" rx="8" fill="#2d1d24"/>
    <text x="15" y="23" fill="#f85149" font-size="13" font-weight="bold">温度相变势阱：T ~ 300 K</text>
    <text x="210" y="23" fill="#8b949e" font-size="11">kB·T ≈ 26 meV</text>
    
    <!-- Low Temp Box -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="261" height="88" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#58a6ff" font-size="11" font-weight="bold">深空极低温量子相干区 (T &lt; 1 K)</text>
      <text x="12" y="42" fill="#8b949e" font-size="10">• 玻色-爱因斯坦凝聚 (BEC) 与超流涡旋网</text>
      <text x="12" y="58" fill="#8b949e" font-size="10">• 极低热噪声下以长程准粒子极化激元演化</text>
      <text x="12" y="74" fill="#58a6ff" font-size="10">→ 水热运动冻结，但量子自组织依然可能</text>
    </g>

    <!-- Mesoscopic Box -->
    <g transform="translate(12, 148)">
      <rect x="0" y="0" width="261" height="150" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="1.2"/>
      <rect x="8" y="8" width="55" height="18" rx="3" fill="#238636"/>
      <text x="12" y="21" fill="#ffffff" font-size="10" font-weight="bold">局域势阱</text>
      <text x="70" y="22" fill="#3fb950" font-size="11" font-weight="bold">【碳水化学流体相：T ≈ 300 K】</text>
      <text x="12" y="46" fill="#c9d1d9" font-size="10">• 强共价键 (几 eV) 维持高分子主干稳定</text>
      <text x="12" y="64" fill="#c9d1d9" font-size="10">• 弱氢键 (几十 meV) 处于皮秒级流变断合</text>
      <text x="12" y="82" fill="#7ee787" font-size="10">• 水分子充当高介电流动溶剂，酶可催化做功</text>
      <text x="12" y="102" fill="#8b949e" font-size="10">• DNA 可常温解旋复制、蛋白质构象可变</text>
      <text x="12" y="124" fill="#3fb950" font-size="10" font-weight="bold">★ 并非全宇宙唯一生境，仅为碳水聚合物势阱！</text>
      <text x="12" y="140" fill="#8b949e" font-size="9">人类是凝聚在这一特定化学平衡面上的局域驻波</text>
    </g>

    <!-- High Temp Box -->
    <g transform="translate(12, 310)">
      <rect x="0" y="0" width="261" height="106" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#f85149" font-size="11" font-weight="bold">天体极高温高密区 (T &gt; 10⁶ K)</text>
      <text x="12" y="42" fill="#8b949e" font-size="10">• 中子星核面条 (Nuclear Pasta) 强核力拓扑</text>
      <text x="12" y="58" fill="#8b949e" font-size="10">• 恒星吸积盘超高温等离子体极端激波自组织</text>
      <text x="12" y="74" fill="#f85149" font-size="10">• 有机共价键彻底汽化，但强力/电磁等离子</text>
      <text x="12" y="90" fill="#8b949e" font-size="9">结构以非线性相变形式运转，我们无法直接理解</text>
    </g>
  </g>

  <!-- Dimension 2: Space Scale -->
  <g transform="translate(355, 95)">
    <rect x="0" y="0" width="285" height="430" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <rect x="0" y="0" width="285" height="36" rx="8" fill="#182635"/>
    <text x="15" y="23" fill="#58a6ff" font-size="13" font-weight="bold">空间几何尺度：L ~ 10⁰ 米</text>
    <text x="205" y="23" fill="#8b949e" font-size="11">力矩与突触平衡</text>
    
    <!-- Micro Box -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="261" height="88" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#8b949e" font-size="11" font-weight="bold">微观极限 (L ≤ 10⁻⁶ m 单细胞/分子)</text>
      <text x="12" y="42" fill="#8b949e" font-size="10">• 受原子半径与分子间隙约束，化学开关容积受限</text>
      <text x="12" y="58" fill="#8b949e" font-size="10">• 无法在微米体积内打包自适应世界模型</text>
      <text x="12" y="74" fill="#8b949e" font-size="10">所需的数百亿非平衡态湿件突触与微血管供能网</text>
    </g>

    <!-- Mesoscopic Box -->
    <g transform="translate(12, 148)">
      <rect x="0" y="0" width="261" height="150" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="1.2"/>
      <rect x="8" y="8" width="55" height="18" rx="3" fill="#1f6feb"/>
      <text x="12" y="21" fill="#ffffff" font-size="10" font-weight="bold">力学驻波</text>
      <text x="70" y="22" fill="#58a6ff" font-size="11" font-weight="bold">【米级力学域：L ≈ 1 ~ 2 米】</text>
      <text x="12" y="46" fill="#c9d1d9" font-size="10">• 骨骼钙质结合力抵抗地表 g 重力剪切</text>
      <text x="12" y="64" fill="#c9d1d9" font-size="10">• 四肢具备宏观力矩杠杆与工具操控力臂</text>
      <text x="12" y="82" fill="#7ee787" font-size="10">• 神经轴突全身体液传导时延控制在数十毫秒</text>
      <text x="12" y="102" fill="#8b949e" font-size="10">• 颅腔容积 (约1.4升) 恰好容纳千亿神经元</text>
      <text x="12" y="124" fill="#58a6ff" font-size="10" font-weight="bold">★ 重力与电磁力在行星表面的局部几何妥协</text>
      <text x="12" y="140" fill="#8b949e" font-size="9">尺度再放大则质量按立方暴增、骨骼受力塌陷</text>
    </g>

    <!-- Macro Box -->
    <g transform="translate(12, 310)">
      <rect x="0" y="0" width="261" height="106" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#8b949e" font-size="11" font-weight="bold">天体宏观态 (L ≥ 10⁶ m ~ 10¹⁶ m)</text>
      <text x="12" y="42" fill="#8b949e" font-size="10">• 行星引力坍缩、星际等离子体大尺度磁流体网</text>
      <text x="12" y="58" fill="#8b949e" font-size="10">• 若生化机体达公里级，质量暴增使骨骼瞬塌；</text>
      <text x="12" y="74" fill="#8b949e" font-size="10">• 内部生化电信号传导需数小时，避险完全休克</text>
      <text x="12" y="90" fill="#8b949e" font-size="9">天体级宏观结构无法依赖化学神经维持因果同步</text>
    </g>
  </g>

  <!-- Dimension 3: Time Scale -->
  <g transform="translate(670, 95)">
    <rect x="0" y="0" width="290" height="430" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.2"/>
    <rect x="0" y="0" width="290" height="36" rx="8" fill="#2d2417"/>
    <text x="15" y="23" fill="#d29922" font-size="13" font-weight="bold">时间动力学：τ ~ 10⁻¹ 秒</text>
    <text x="195" y="23" fill="#8b949e" font-size="11">水合离子斯托克斯阻尼</text>
    
    <!-- Fast Box -->
    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="266" height="88" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#8b949e" font-size="11" font-weight="bold">超快能区 (τ ≤ 10⁻⁹ s 纳秒/飞秒)</text>
      <text x="12" y="42" fill="#8b949e" font-size="10">• 硅基芯片晶格翻转 (GHz)、微观电子漂移</text>
      <text x="12" y="58" fill="#8b949e" font-size="10">• 重水分子与重离子在流体中存在巨大斯托克斯拖拽</text>
      <text x="12" y="74" fill="#8b949e" font-size="10">碳基湿件物理上无法跟随时钟；在人类窗口平均为白噪声</text>
    </g>

    <!-- Mesoscopic Box -->
    <g transform="translate(12, 148)">
      <rect x="0" y="0" width="266" height="150" rx="6" fill="#1f242c" stroke="#3fb950" stroke-width="1.2"/>
      <rect x="8" y="8" width="55" height="18" rx="3" fill="#b08800"/>
      <text x="12" y="21" fill="#ffffff" font-size="10" font-weight="bold">心智视窗</text>
      <text x="70" y="22" fill="#d29922" font-size="11" font-weight="bold">【本真现在窗口：τ ≈ 100 毫秒】</text>
      <text x="12" y="46" fill="#c9d1d9" font-size="10">• 钠钾重离子水合外壳跨膜去极化 (1~5ms)</text>
      <text x="12" y="64" fill="#c9d1d9" font-size="10">• 皮层功能柱前馈-侧向抑制稳态振荡 (50~100ms)</text>
      <text x="12" y="82" fill="#7ee787" font-size="10">• 40Hz Gamma 波驱动全脑全局工作空间相干闭环</text>
      <text x="12" y="102" fill="#8b949e" font-size="10">• 消除无限小瞬时切片的死寂，渲染出运动与因果</text>
      <text x="12" y="124" fill="#d29922" font-size="10" font-weight="bold">★ 人类全部情感、痛苦、美与自我意识的物理窗口</text>
      <text x="12" y="140" fill="#8b949e" font-size="9">不是宇宙唯一感知窗口，仅为碳基积分器物理固有极值</text>
    </g>

    <!-- Slow Box -->
    <g transform="translate(12, 310)">
      <rect x="0" y="0" width="266" height="106" rx="5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="22" fill="#8b949e" font-size="11" font-weight="bold">极慢地质与天体态 (τ ≥ 10⁴ s ~ 10¹⁴ s)</text>
      <text x="12" y="42" fill="#8b949e" font-size="10">• 地壳板块运动、恒星聚变演化、星系旋转</text>
      <text x="12" y="58" fill="#8b949e" font-size="10">• 若生物决策时钟以秒计，面对地表机械冲击等同休克；</text>
      <text x="12" y="74" fill="#8b949e" font-size="10">• 跨百万年的天体结构在人类数十年寿命下，</text>
      <text x="12" y="90" fill="#8b949e" font-size="9">由于观察时钟断层，呈现为永恒静止、不可交互的顽石</text>
    </g>
  </g>

  <!-- Bottom Panel: The Scale Overlap Principle -->
  <g transform="translate(40, 540)">
    <rect x="0" y="0" width="920" height="100" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <g transform="translate(20, 15)">
      <rect x="0" y="0" width="880" height="70" rx="5" fill="#1f242c" stroke="#58a6ff" stroke-width="1"/>
      <text x="15" y="24" fill="#58a6ff" font-size="12" font-weight="bold">核心哲学突破：尺度重叠律 (The Scale Overlap Principle)</text>
      <text x="15" y="44" fill="#c9d1d9" font-size="11">• 宇宙在其他相空间孤岛上完全可能演化出稳定自组织，只是由于【零尺度重叠】，我们无法感知与理解，彼此互为物理幽灵。</text>
      <text x="15" y="60" fill="#7ee787" font-size="10">• 异质系统能够相互察觉、形成理解的唯一充要条件是【尺度的交汇重叠与阻抗匹配】（正如人类与硅基芯片通过去抖滤波与 Token 重叠）。</text>
    </g>
  </g>
</svg>