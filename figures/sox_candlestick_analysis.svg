    <line x1="580" y1="95" x2="580" y2="155" stroke="#f85149"/>
    <rect x="576" y="125" width="8" height="20" fill="#f85149"/>
  </g>

  <!-- Phase 4: Wyckoff Distribution / Head & Shoulders Top Pattern -->
  <g stroke="#f85149" stroke-width="1.5">
    <!-- Selloff 1 -->
    <line x1="620" y1="130" x2="620" y2="185"/>
    <rect x="616" y="135" width="8" height="40" fill="#f85149"/>
    <!-- Technical Rebound (Right Shoulder) -->
    <line x1="670" y1="110" x2="670" y2="165" stroke="#3fb950"/>
    <rect x="666" y="115" width="8" height="35" fill="#3fb950"/>
    <line x1="710" y1="105" x2="710" y2="155" stroke="#f85149"/>
    <rect x="706" y="120" width="8" height="25" fill="#f85149"/>
    <!-- Churning & Stalling (Double Top / Broadening) -->
    <line x1="750" y1="120" x2="750" y2="175"/>
    <rect x="746" y="130" width="8" height="35" fill="#f85149"/>
    <line x1="790" y1="135" x2="790" y2="190" stroke="#3fb950"/>
    <rect x="786" y="140" width="8" height="35" fill="#3fb950"/>
    <!-- Breakdown below MA20 / MA50 -->
    <line x1="830" y1="150" x2="830" y2="215"/>
    <rect x="826" y="160" width="8" height="45" fill="#f85149"/>
    <line x1="870" y1="170" x2="870" y2="230"/>
    <rect x="866" y="180" width="8" height="40" fill="#f85149"/>
    <line x1="910" y1="185" x2="910" y2="245"/>
    <rect x="906" y="195" width="8" height="40" fill="#f85149"/>
  </g>

  <!-- Technical Annotations (Boxes & Callouts) -->
  <!-- Callout 1: ATH / Buying Climax -->
  <g>
    <rect x="520" y="70" width="140" height="24" rx="4" fill="#1f242c" stroke="#f85149" stroke-width="1"/>
    <text x="590" y="86" fill="#f85149" font-size="11" font-weight="bold" text-anchor="middle">历史高位 (Buying Climax)</text>
    <line x1="585" y1="95" x2="585" y2="105" stroke="#f85149" stroke-width="1"/>
  </g>

  <!-- Callout 2: High Level Churning (Distribution) -->
  <g>
    <rect x="670" y="70" width="160" height="24" rx="4" fill="#1f242c" stroke="#d29922" stroke-width="1"/>
    <text x="750" y="86" fill="#d29922" font-size="11" font-weight="bold" text-anchor="middle">高位放量派发 (Distribution)</text>
  </g>

  <!-- Resistance / Support Lines -->
  <!-- Resistance Line -->
  <line x1="540" y1="102" x2="800" y2="102" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="810" y="106" fill="#f85149" font-size="10">强阻力位 (Resistance)</text>

  <!-- Neckline / Support Line -->
  <line x1="590" y1="185" x2="930" y2="185" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="940" y="189" fill="#58a6ff" font-size="10">颈线破位 (Neckline)</text>

  <!-- MACD Indicator Section -->
  <g>
    <!-- MACD Zero Line -->
    <line x1="80" y1="490" x2="940" y2="490" stroke="#484f58" stroke-width="1"/>
    <!-- MACD Histogram Bars -->
    <!-- Positive expanding in 2023 -->
    <rect x="230" y="475" width="6" height="15" fill="#3fb950"/>
    <rect x="260" y="465" width="6" height="25" fill="#3fb950"/>
    <rect x="300" y="460" width="6" height="30" fill="#3fb950"/>
    <!-- Peak momentum in early 2024 -->
    <rect x="450" y="450" width="6" height="40" fill="#3fb950"/>
    <rect x="490" y="445" width="6" height="45" fill="#3fb950"/>
    <!-- Bearish Divergence: Price higher, but MACD lower! -->
    <rect x="580" y="465" width="6" height="25" fill="#3fb950"/>
    <rect x="670" y="475" width="6" height="15" fill="#3fb950"/>
    <!-- Negative MACD after breakdown -->
    <rect x="750" y="490" width="6" height="18" fill="#f85149"/>
    <rect x="830" y="490" width="6" height="28" fill="#f85149"/>
    <rect x="870" y="490" width="6" height="35" fill="#f85149"/>
    <rect x="910" y="490" width="6" height="38" fill="#f85149"/>

    <!-- MACD Fast/Slow Lines -->
    <path d="M 100,505 Q 260,460 480,445 T 600,465 T 750,495 T 920,535" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
    <path d="M 100,510 Q 260,475 480,458 T 600,470 T 750,490 T 920,520" fill="none" stroke="#d29922" stroke-width="1.8"/>

    <!-- Divergence Trendlines -->
    <!-- Price Higher Trendline -->
    <line x1="490" y1="150" x2="670" y2="105" stroke="#f85149" stroke-width="2"/>
    <text x="560" y="120" fill="#f85149" font-size="10" font-weight="bold">股价创出新高 (Higher High)</text>

    <!-- MACD Lower Trendline -->
    <line x1="490" y1="445" x2="670" y2="475" stroke="#f85149" stroke-width="2"/>
    <text x="560" y="515" fill="#f85149" font-size="10" font-weight="bold">MACD显著走低 (Lower High: 严重顶背离)</text>
  </g>

  <!-- Volume & Breadth Section -->
  <g>
    <!-- Volume bars -->
    <rect x="110" y="590" width="6" height="20" fill="#238636"/>
    <rect x="230" y="580" width="6" height="30" fill="#238636"/>
    <rect x="450" y="565" width="6" height="45" fill="#238636"/>
    <rect x="490" y="560" width="6" height="50" fill="#238636"/>
    <!-- Huge Churning Volume at Top -->
    <rect x="580" y="550" width="8" height="60" fill="#da3633"/>
    <rect x="620" y="555" width="8" height="55" fill="#da3633"/>
    <rect x="670" y="570" width="8" height="40" fill="#238636"/>
    <rect x="710" y="552" width="8" height="58" fill="#da3633"/>
    <rect x="750" y="560" width="8" height="50" fill="#da3633"/>
    <rect x="830" y="545" width="8" height="65" fill="#da3633"/>

    <!-- Breadth Line (Advance/Decline Line plunging) -->
    <path d="M 100,590 Q 300,575 500,580 T 700,605 T 920,625" fill="none" stroke="#bc8cff" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="820" y="595" fill="#bc8cff" font-size="10">市场宽度腾落线崩解 (Broad Weakness)</text>
  </g>

  <!-- Macro Fundamental Badges (Bottom Right) -->
  <g transform="translate(680, 260)">
    <rect x="0" y="0" width="260" height="110" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
    <text x="15" y="22" fill="#58a6ff" font-size="11" font-weight="bold">宏观基本面风险锚点 (Fundamental Risks):</text>
    <text x="15" y="42" fill="#c9d1d9" font-size="10">• 10Y 美债收益率高企 (折现率压制 P/E)</text>
    <text x="15" y="60" fill="#c9d1d9" font-size="10">• 股权风险溢价 (ERP) 降至历史极低负值</text>
    <text x="15" y="78" fill="#c9d1d9" font-size="10">• 结构极端撕裂：算力繁荣 vs. 模拟/工控去库</text>
    <text x="15" y="96" fill="#f85149" font-size="10">• 财报利好钝化：放量滞涨与冲高回落 (Sell-the-news)</text>
  </g>
</svg>
