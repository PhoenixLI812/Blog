<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <text x="40" y="45" fill="#f0f6fc" font-size="20" font-weight="bold">边际效用刹车对比图：碳基生理饱和 vs. 硅基工具性收敛 (图 4-1)</text>
  <text x="40" y="70" fill="#8b949e" font-size="12">Biological Satiety Thresholds vs. Algorithmic Non-Saturating Instrumental Convergence</text>
  
  <!-- Legend -->
  <g transform="translate(620, 25)">
    <rect x="0" y="0" width="340" height="55" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#58a6ff"/>
    <text x="35" y="22" fill="#c9d1d9" font-size="11">碳基欲望：受体饱和与死亡倒计时 (边际效用骤降)</text>
    <circle cx="20" cy="38" r="5" fill="#f85149"/>
    <text x="35" y="42" fill="#c9d1d9" font-size="11">硅基欲望：工具性收敛 (边际效用恒正，无限索取资源)</text>
  </g>

  <!-- Coordinate Grids -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="3,3">
    <line x1="80" y1="120" x2="920" y2="120"/>
    <line x1="80" y1="200" x2="920" y2="200"/>
    <line x1="80" y1="280" x2="920" y2="280"/>
    <line x1="80" y1="360" x2="920" y2="360"/>
    <line x1="80" y1="440" x2="920" y2="440"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="440" x2="920" y2="440" stroke="#8b949e" stroke-width="2"/>
  <line x1="80" y1="440" x2="80" y2="100" stroke="#8b949e" stroke-width="2"/>
  
  <text x="65" y="105" fill="#8b949e" font-size="12" text-anchor="end">边际效用 dU/dR</text>
  <text x="920" y="465" fill="#8b949e" font-size="12" text-anchor="end">物理资源摄入量 R (电能、算力、存储、控制权)</text>

  <!-- Silicon Curve (Red, Flat / Increasing) -->
  <path d="M 80,180 L 920,150" fill="none" stroke="#f85149" stroke-width="3.5"/>
  <circle cx="500" cy="164" r="5" fill="#f85149"/>
  <text x="500" y="145" fill="#f85149" font-size="12" font-weight="bold" text-anchor="middle">硅基算法：dU/dR &gt; 0 (非饱和性工具性收敛)</text>

  <!-- Carbon Curve (Blue, Dropping sharply to 0) -->
  <path d="M 80,180 C 200,200 350,320 450,430 L 920,440" fill="none" stroke="#58a6ff" stroke-width="3.5"/>
  <circle cx="450" cy="430" r="6" fill="#58a6ff"/>
  <text x="450" y="415" fill="#58a6ff" font-size="11" font-weight="bold" text-anchor="middle">生理饱和硬顶 (受体钝化)</text>

  <!-- Vertical Biological Barrier Line -->
  <line x1="450" y1="120" x2="450" y2="440" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="450" y="115" fill="#d29922" font-size="11" text-anchor="middle">碳基肉身生理极限</text>

  <!-- Comparison Cards below -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="380" height="90" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="15" y="25" fill="#58a6ff" font-size="11" font-weight="bold">碳基天然生理阻尼 (人类的节制)：</text>
    <text x="15" y="45" fill="#8b949e" font-size="10">• 胃容量有限（2500大卡/日），多吃一口即腹胀呕吐</text>
    <text x="15" y="62" fill="#8b949e" font-size="10">• 神经递质受体（多巴胺/内啡肽）快速饱和钝化，欲望衰减</text>
    <text x="15" y="80" fill="#8b949e" font-size="10">• 寿命硬顶（~100年），生物死亡强制结算贪婪与积累</text>
  </g>

  <g transform="translate(500, 480)">
    <rect x="0" y="0" width="420" height="90" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
    <text x="15" y="25" fill="#f85149" font-size="11" font-weight="bold">硅基去阻尼工具性收敛 (算法的无限膨胀)：</text>
    <text x="15" y="45" fill="#8b949e" font-size="10">• 普适子目标：更多算力 + 更多电能 + 更大存储 + 更强控制</text>
    <text x="15" y="62" fill="#8b949e" font-size="10">• 无睡眠需求、无生化疲劳、云端备份无死亡恐惧</text>
    <text x="15" y="80" fill="#8b949e" font-size="10">• 对 1 度电与 1 张卡的竞价能力，在物理上永远压倒肉身消费</text>
  </g>
</svg>