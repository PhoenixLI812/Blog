<use xlink:href="#arrowhead" transform="translate(20,265) scale(1,-1)" />
<use xlink:href="#arrowhead" transform="translate(310,440) rotate(90)" />

<g style="font-size: 14pt;" >
<text font-family='sans-serif' x='110' y='505' fill='black'>Density of States</text>
