      border-left: 4px solid var(--theme-color);

      color: var(--text-color);

    /* 核心推演特性标签 */
    .cover-features {

    .feature-tag {
      background: rgba(255, 255, 255, 0.04);

    /* 核心行动按钮 */

      margin-bottom: 30px;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #1f6feb 0%, #238636 100%);
      color: #ffffff !important;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 14px 36px;
      border-radius: 9999px;

    .cta-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 32px rgba(31, 111, 235, 0.6);
      background: linear-gradient(135deg, #388bfd 0%, #2ea043 100%);
    }

    .cta-button svg {
      transition: transform 0.2s ease;
    }

    .cta-button:hover svg {
      transform: translateX(4px);
    }

    /* 滚动提示动画 */
    .cover-scroll-hint {
      color: #8b949e;
      opacity: 0.6;
      animation: bounce 2s infinite;
      margin-top: 10px;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(8px); }
      60% { transform: translateY(4px); }
    }

    /* 移动端深度优化 */
    @media (max-width: 768px) {
      .markdown-section {
        padding: 20px 18px 60px;
      }
      section.cover .cover-main h1 {
        font-size: 2.4rem;
      }
      .cover-subtitle-cn {
        font-size: 1.05rem;
      }
      .quote-text {
        font-size: 0.95rem;
      }
      .cover-features {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

  <script>
    // 强制穿透浏览器与 GitHub Pages CDN 对 .md 章节文件的缓存
    (function() {

      var origOpen = XMLHttpRequest.prototype.open;

          var sep = url.indexOf('?') === -1 ? '?' : '&';

    window.$docsify = {

      // 路由别名统一
      alias: {
        '/manuscript/00_序言_在算力中心的轰鸣与窗外的落叶之间': '/'
      },
      
      // 搜索配置
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索全书论点、模型与核心术语...',
        noData: '未找到相关章节或公式',
        depth: 6
      },

      // 复制代码配置
      copyCode: {
        buttonText: '复制',
        errorText: '失败',

      },

      // 分页导航配置
      pagination: {

        nextText: '下一章 ❯',
        crossChapter: true,
        crossChapterText: true
      },

      // 插件拓展
      plugins: [
        function(hook, vm) {
          // 处理 Markdown 转换后的 HTML
          hook.afterEach(function(html, next) {
            // 1. 彻底解开单波浪线导致的错误删除线 <del>
            html = html.replace(/<del>([\s\S]*?)<\/del>/gi, '$1');

            // 2. 将 mermaid 代码块替换为可执行容器
            var div = document.createElement('div');
            div.innerHTML = html;
            div.querySelectorAll('pre[data-lang="mermaid"]').forEach(function(el) {
              var code = el.querySelector('code') ? el.querySelector('code').textContent : el.textContent;
              var container = document.createElement('div');
              container.className = 'mermaid';
              container.textContent = code;
              el.parentNode.replaceChild(container, el);
            });
            next(div.innerHTML);
          });

          // 渲染完成后的 DOM 增强
          hook.doneEach(function() {
            // KaTeX 再次兜底渲染
            if (window.renderMathInElement) {
              renderMathInElement(document.querySelector('.markdown-section'), {
                delimiters: [
                  {left: '$$', right: '$$', display: true},
                  {left: '$', right: '$', display: false}
                ],
                throwOnError: false
              });
            }

            // 运行 Mermaid 图表渲染
            if (window.mermaid) {
              try {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                mermaid.initialize({
                  startOnLoad: false,
                  securityLevel: 'loose',
                  theme: isDark ? 'dark' : 'default',
                  fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
                });
                mermaid.run({
                  querySelector: '.mermaid'
                });
              } catch (e) {
                console.warn('Mermaid rendering:', e);
              }
            }

            // 确保序言（无论通过封面点击还是从主页滚动）底端永远拥有“下一章”按钮
            var paginationContainer = document.querySelector('.docsify-pagination-container');
            if (paginationContainer) {
              var path = vm.route.path;
              var isPrologue = (path === '/' || path === '' || path.indexOf('00_序言') !== -1);
              if (isPrologue && !paginationContainer.querySelector('.pagination-item--next')) {
                var navLinks = document.querySelectorAll('.sidebar-nav li a');
                var nextLink = null;
                for (var k = 0; k < navLinks.length; k++) {
                  var href = navLinks[k].getAttribute('href') || '';
                  if (href.indexOf('01_第一章') !== -1) {
                    nextLink = navLinks[k];
                    break;
                  }
                }
                if (nextLink) {
                  var nextHref = nextLink.getAttribute('href');
                  var nextTitle = nextLink.innerText || '第 01 章：二阶导的重力（半导体与物价的时差）';
                  paginationContainer.innerHTML = 
                    '<div class="pagination-item pagination-item--next">' +
                      '<a href="' + nextHref + '">' +
                        '<div class="pagination-item-label">' +
                          '<span>下一章</span>' +
                          '<svg width="10" height="16" viewBox="0 0 10 16" xmlns="http://www.w3.org/2000/svg">' +
                            '<polyline fill="none" vector-effect="non-scaling-stroke" points="2,2 8,8 2,14"/>' +
                          '</svg>' +
                        '</div>' +
                        '<div class="pagination-item-title">' + nextTitle + '</div>' +
                      '</a>' +
                    '</div>';
                }
              }
            }
          });
        }
      ]
    };

  <script>
    // 禁用 Marked 的单波浪线删除线规则（仅允许 ~~del~~，保护 ~450 点 与 10%~15%）
    if (window.marked) {
      window.marked.use({
        tokenizer: {
          del: function(src) {
            var match = /^~~(?=[^\s~])([\s\S]*?[^\s~])~~(?=[^~]|$)/.exec(src);
            if (match) {
              return {
                type: 'del',
                raw: match[0],
                text: match[1],
                tokens: this.lexer.inlineTokens(match[1])
              };
            }
            return false;
          }
        },
        renderer: {
          del: function(text) {
            return text;
          }
        }
      });
    }

    // 阅读进度条监听
    window.addEventListener('scroll', function() {
      var docElem = document.documentElement;
      var docBody = document.body;
      var scrollTop = docElem.scrollTop || docBody.scrollTop;
      var scrollBottom = (docElem.scrollHeight || docBody.scrollHeight) - window.innerHeight;
      var scrollPercent = scrollBottom > 0 ? (scrollTop / scrollBottom) * 100 : 0;
      document.getElementById('reading-progress').style.width = scrollPercent + '%';
    });

    // 明暗主题切换支持
    var themeBtn = document.getElementById('themeBtn');
    var currentTheme = localStorage.getItem('blog-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeBtn.textContent = theme === 'dark' ? '☀️' : '🌓';
      localStorage.setItem('blog-theme', theme);

      // 主题切换时重新渲染 Mermaid 适配配色
      if (window.mermaid) {
        try {
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: 'loose',
            theme: theme === 'dark' ? 'dark' : 'default',
            fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif'
          });
          mermaid.run({ querySelector: '.mermaid' });
        } catch(e) {}
      }
    }

    applyTheme(currentTheme);

    themeBtn.addEventListener('click', function() {
      var nextTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    });

    // 封面“开启阅读”按钮与向下箭头点击平滑滚入正文
    document.addEventListener('click', function(e) {
      var cta = e.target.closest('.cta-button, .cover-scroll-hint');
      if (cta) {
        e.preventDefault();
        var target = document.getElementById('main') || document.querySelector('.markdown-section') || document.querySelector('.content');
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        } else {
          window.scrollTo({
            top: window.innerHeight,
            behavior: 'smooth'
          });
        }
      }
    });
  </script>
</body>
</html>
